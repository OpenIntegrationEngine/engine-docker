name: Build production images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - dockerfiles/**

concurrency: build-images

jobs:
  list-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version slugs from releases.yaml
        id: versions
        run: echo "versions=$(yq -o=json -I=0 '[.versions[].slug]' releases.yaml)" >> "$GITHUB_OUTPUT"

  build-images:
    needs: list-versions
    runs-on: ubuntu-latest
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        oie_version: ${{ fromJSON(needs.list-versions.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        working-directory: dockerfiles/${{ matrix.oie_version }}
        run: |
          docker compose --progress plain build --build-arg CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ") --push
          docker image ls
